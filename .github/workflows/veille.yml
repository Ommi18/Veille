name: Veille billets

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Verifier la billetterie
        run: |
          pip install requests -q
          python - <<'PY'
          import re, requests

          URL = "https://billetterie.fff.fr/fr/france_turquie_dimanche_15_novembre_2026/grand_public"
          HEADERS = {"User-Agent": "Mozilla/5.0 (veille personnelle)"}

          r = requests.get(URL, headers=HEADERS, timeout=20)
          html = r.text
          print("statut:", r.status_code, "| taille:", len(html))
          print("CATEGORIE (majuscules):", html.count("CATEGORIE"), "| Complet:", html.count("Complet"))

          n = 0
          for m in re.finditer("CATEGORIE", html):
              n += 1
              if n > 2:
                  break
              print("----- bloc", n)
              debut = max(0, m.start() - 100)
              fin = m.start() + 700
              print(re.sub(r"\s+", " ", html[debut:fin]))
          PY
