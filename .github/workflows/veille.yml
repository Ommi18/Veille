name: Veille billets

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Verifier la billetterie
        run: |
          pip install requests -q
          python - <<'PY'
          import re, requests

          URL = "https://billetterie.fff.fr/fr/france_turquie_dimanche_15_novembre_2026/grand_public"
          HEADERS = {"User-Agent": "Mozilla/5.0 (veille personnelle)"}

          r = requests.get(URL, headers=HEADERS, timeout=20)
          html = r.text
          low = html.lower()
          print("statut:", r.status_code, "| taille:", len(html))
          print("occurrences de 'complet':", low.count("complet"))
          print("occurrences de 'categorie':", low.count("categorie"))

          for m in list(re.finditer("categorie", low))[:3]:
              debut = max(0, m.start() - 150)
              fin = m.start() + 350
              print("-----")
              print(re.sub(r"\s+", " ", html[debut:fin]))
          PY
